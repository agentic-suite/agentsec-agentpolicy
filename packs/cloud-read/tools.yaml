version: '1.0'
posture: balanced
environments:
  development:
    criticality: 0.0
  production:
    criticality: 0.5
data_classes:
  public:
    sensitivity: 0.0
  internal:
    sensitivity: 0.2
rules:
- decision: deny
  action: delete
  tool: describe_instances
  reason: Delete actions are not covered by this read-only pack.
- decision: escalate
  action: write
  environment: production
  reason: Write actions in cloud require approval.
