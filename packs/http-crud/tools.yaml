version: '1.0'
posture: permissive
environments:
  development:
    criticality: 0.0
  production:
    criticality: 0.5
data_classes:
  public:
    sensitivity: 0.0
  internal:
    sensitivity: 0.2
rules:
- decision: deny
  action: delete
  environment: production
  reason: HTTP DELETE is blocked in production.
- decision: escalate
  action: write
  environment: production
  reason: Write operations in production require approval.
