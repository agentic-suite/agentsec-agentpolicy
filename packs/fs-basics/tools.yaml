version: '1.0'
posture: balanced
environments:
  development:
    criticality: 0.0
  staging:
    criticality: 0.1
  production:
    criticality: 0.7
data_classes:
  public:
    sensitivity: 0.0
  internal:
    sensitivity: 0.2
  restricted:
    sensitivity: 0.5
rules:
- decision: deny
  action: delete
  tool: read_file
  reason: File deletion is not covered by this pack.
- decision: deny
  tool: delete_file
  reason: Delete operations are blocked.
